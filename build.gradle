apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.noise.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.noise.app"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // NDK version matched with your system path
        ndkVersion "27.3.13750724"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        
        // चूँकि सिर्फ खुद के लिए बनाना है, तो पुराने फोन (v7a) का कचरा हटा दिया। 
        // सिर्फ तुम्हारे फोन (v8a) के लिए बिल्ड होगा।
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
                // Bypass CMake checks aur ARM64 TLS Linker crash fix
                arguments "-DANDROID_STL=c++_shared",
                          "-DCMAKE_C_COMPILER_WORKS=TRUE",
                          "-DCMAKE_CXX_COMPILER_WORKS=TRUE",
                          "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,notext", 
                          "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,notext -Wl,-z,max-page-size=65536"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        prefab true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            pickFirsts += ['**/*.so']
            keepDebugSymbols += ['**/*.so']
        }
    }
}

// Disable native stripping tasks completely for Android environment
tasks.whenTaskAdded { task ->
    if (task.name.contains("StripDebugSymbols")) {
        task.enabled = false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    
    // UI & AppCompat Dependencies
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Jetpack Compose Dependencies
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Oboe AAR file connection
    implementation files('libs/oboe-1.10.0.aar')

    // Testing Dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
