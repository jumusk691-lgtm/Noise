name: Build Android App Automatically

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip noise.zip
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Let Gradle Auto-Download Missing Components
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        # Gradle को खुद आज़ादी देते हैं कि जो न मिले उसे अपने आप डाउनलोड कर ले
        ./gradlew assembleDebug --no-daemon --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
