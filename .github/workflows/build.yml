name: Build Android App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip noise.zip
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Disable External Native Build
      run: |
        # local.properties में साफ़ कर देते हैं ताकि कोई गंदा पाथ न रहे
        rm -f local.properties

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon -Pandroid.experimental.skipCompileCpp=true
